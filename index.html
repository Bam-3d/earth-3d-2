<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โครงสร้างโลก 3 มิติ</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Tahoma",sans-serif;
  color:white;
  background:#020817;
}

body{
  background:
    radial-gradient(circle at 40% 45%,#063b78 0%,transparent 28%),
    radial-gradient(circle at 80% 20%,#061f48 0%,transparent 25%),
    #020817;
}

/* ดาว */
.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:.7;
}

/* หัวเว็บ */
.header{
  position:absolute;
  top:22px;
  left:30px;
  z-index:10;
}

.header h1{
  margin:0;
  font-size:42px;
  color:#fff;
  text-shadow:0 0 20px #198cff;
}

.header p{
  margin:5px 0;
  font-size:17px;
  color:#b9dfff;
}

/* พื้นที่โลก */
#earthArea{
  position:absolute;
  left:2%;
  right:31%;
  top:8%;
  bottom:5%;
}

/* โลก */
#earth{
  width:100%;
  height:100%;
}

/* ปุ่มควบคุม */
.controls{
  position:absolute;
  left:28px;
  top:42%;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.controls button{
  width:62px;
  height:62px;
  border-radius:16px;
  border:1px solid #1687ed;
  background:#03182cdd;
  color:white;
  font-size:26px;
  cursor:pointer;
  box-shadow:0 0 20px #0879db44;
}

.controls small{
  display:block;
  font-size:10px;
}

/* แถบเลือกชั้น */
.layers{
  position:absolute;
  left:13%;
  right:32%;
  bottom:25px;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:20;
}

.layer{
  width:105px;
  height:92px;
  border-radius:18px;
  border:1px solid #164c7b;
  background:#04182bdd;
  color:white;
  cursor:pointer;
}

.layer.active{
  border-color:#2798ff;
  box-shadow:0 0 25px #148aff77;
}

.layerIcon{
  width:48px;
  height:48px;
  margin:7px auto 3px;
  border-radius:50%;
}

.crust{
  background:radial-gradient(circle at 35% 30%,#a66c3b,#4c2412);
}

.mantle{
  background:radial-gradient(circle at 35% 30%,#ffbf35,#e13d0b);
}

.outer{
  background:radial-gradient(circle at 35% 30%,#ff633c,#94140a);
}

.inner{
  background:radial-gradient(circle at 35% 30%,#fff36a,#ff9d00);
}

.layer span{
  font-size:12px;
}

/* กล่องข้อมูล */
.infoPanel{
  position:absolute;
  top:10%;
  right:22px;
  bottom:5%;
  width:30%;
  min-width:310px;
  z-index:15;

  background:linear-gradient(
    180deg,
    #04172aec,
    #020c18f5
  );

  border:1px solid #1586ee;
  border-radius:22px;

  box-shadow:
    0 20px 60px #000b,
    inset 0 1px #ffffff18;

  overflow:auto;
}

.infoPanel h2{
  margin:0;
  padding:22px;
  font-size:25px;
}

/* แท็บ */
.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  padding:0 15px 15px;
}

.tabs button{
  padding:10px 4px;
  border-radius:12px;
  border:1px solid #1764a5;
  background:#06182a;
  color:#cce7ff;
  cursor:pointer;
  font-size:11px;
}

.tabs button.active{
  background:#287ff0;
  color:white;
}

/* ข้อมูล */
.content{
  padding:8px 22px 30px;
}

.title{
  font-size:24px;
  font-weight:bold;
  color:#76c3ff;
  margin-bottom:10px;
}

.description{
  line-height:1.7;
  color:#d9eaff;
}

.data{
  margin-top:18px;
}

.dataBox{
  padding:13px;
  margin-bottom:9px;
  border-radius:14px;
  background:#06192b;
  border:1px solid #17466e;
}

.dataBox b{
  display:block;
  margin-bottom:4px;
}

.dataBox span{
  color:#afd0ed;
}

.fact{
  margin-top:18px;
  padding:16px;
  border-radius:15px;
  background:#071d31;
  border:1px solid #27638d;
  line-height:1.6;
}

.fact b{
  color:#ffd44d;
}

/* มือถือ */
@media(max-width:850px){

  .header{
    top:12px;
    left:15px;
  }

  .header h1{
    font-size:27px;
  }

  .header p{
    font-size:12px;
  }

  #earthArea{
    left:0;
    right:0;
    top:9%;
    bottom:38%;
  }

  .controls{
    left:10px;
    top:30%;
  }

  .controls button{
    width:48px;
    height:48px;
    font-size:20px;
  }

  .layers{
    left:8px;
    right:8px;
    bottom:40%;
    justify-content:flex-start;
    overflow-x:auto;
  }

  .layer{
    min-width:82px;
    height:70px;
  }

  .layerIcon{
    width:34px;
    height:34px;
  }

  .infoPanel{
    left:10px;
    right:10px;
    top:auto;
    bottom:10px;
    width:auto;
    min-width:0;
    max-height:37%;
  }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="header">
  <h1>🌍 โครงสร้างโลก 3 มิติ</h1>
  <p>สำรวจภายในโลกของเรา ตั้งแต่เปลือกโลกจนถึงแก่นโลก</p>
</div>

<div id="earthArea"></div>

<div class="controls">
  <button onclick="resetEarth()">↻<small>รีเซ็ต</small></button>
  <button onclick="zoomIn()">＋<small>ซูม</small></button>
  <button onclick="zoomOut()">−<small>ออก</small></button>
</div>

<!-- ปุ่มเลือกชั้น -->
<div class="layers">

  <button class="layer active" onclick="selectLayer('all',this)">
    <div class="layerIcon crust"></div>
    <span>ทั้งหมด</span>
  </button>

  <button class="layer" onclick="selectLayer('crust',this)">
    <div class="layerIcon crust"></div>
    <span>เปลือกโลก</span>
  </button>

  <button class="layer" onclick="selectLayer('mantle',this)">
    <div class="layerIcon mantle"></div>
    <span>เนื้อโลก</span>
  </button>

  <button class="layer" onclick="selectLayer('outer',this)">
    <div class="layerIcon outer"></div>
    <span>แก่นโลกชั้นนอก</span>
  </button>

  <button class="layer" onclick="selectLayer('inner',this)">
    <div class="layerIcon inner"></div>
    <span>แก่นโลกชั้นใน</span>
  </button>

</div>

<!-- ข้อมูล -->
<div class="infoPanel">

  <h2>รายละเอียดแต่ละชั้น</h2>

  <div class="tabs">

    <button class="active" onclick="showInfo('crust',this)">
      เปลือกโลก
    </button>

    <button onclick="showInfo('mantle',this)">
      เนื้อโลก
    </button>

    <button onclick="showInfo('outer',this)">
      แก่นนอก
    </button>

    <button onclick="showInfo('inner',this)">
      แก่นใน
    </button>

  </div>

  <div class="content" id="content"></div>

</div>

<script>

/* =========================
   ดาวพื้นหลัง
========================= */

for(let i=0;i<180;i++){

  const star=document.createElement("div");

  star.className="star";

  star.style.left=Math.random()*100+"%";
  star.style.top=Math.random()*100+"%";

  star.style.opacity=.2+Math.random()*.8;

  document.getElementById("stars")
    .appendChild(star);
}


/* =========================
   ข้อมูลแต่ละชั้น
========================= */

const data={

crust:{
 title:"เปลือกโลก (Crust)",

 desc:
 "เป็นชั้นนอกสุดของโลก เป็นชั้นที่มนุษย์อาศัยอยู่ ประกอบด้วยหินและแร่หลายชนิด และเป็นบริเวณที่เกิดภูมิประเทศต่าง ๆ เช่น ภูเขา ที่ราบ และพื้นมหาสมุทร",

 items:[
 ["ความลึก","ประมาณ 0–70 กิโลเมตร"],
 ["สถานะ","ของแข็ง"],
 ["องค์ประกอบ","หินและแร่หลายชนิด"],
 ["อุณหภูมิ","เพิ่มขึ้นตามความลึก"]
 ],

 fact:
 "เปลือกโลกมีทั้งเปลือกโลกทวีปและเปลือกโลกมหาสมุทร ซึ่งมีความหนาแตกต่างกัน"
},

mantle:{
 title:"เนื้อโลก (Mantle)",

 desc:
 "อยู่ถัดจากเปลือกโลกลงไปและเป็นชั้นที่มีความหนามากที่สุดของโลก ประกอบด้วยหินร้อนและแร่ซิลิเกต โดยมีการเคลื่อนที่อย่างช้ามากในช่วงเวลาทางธรณีวิทยา",

 items:[
 ["ความลึก","ประมาณ 70–2,900 กิโลเมตร"],
 ["สถานะ","ของแข็งเป็นหลัก"],
 ["องค์ประกอบ","แร่ซิลิเกต เหล็ก และแมกนีเซียม"],
 ["บทบาท","เกี่ยวข้องกับการเคลื่อนที่ของแผ่นธรณีภาค"]
 ],

 fact:
 "ความร้อนภายในโลกทำให้เกิดการถ่ายเทความร้อนภายในเนื้อโลก ซึ่งเกี่ยวข้องกับพลวัตของโลก"
},

outer:{
 title:"แก่นโลกชั้นนอก (Outer Core)",

 desc:
 "เป็นชั้นที่อยู่รอบแก่นโลกชั้นใน ประกอบด้วยโลหะร้อนเป็นหลักและมีสถานะเป็นของเหลว การไหลของโลหะนำไฟฟ้าภายในชั้นนี้เกี่ยวข้องกับสนามแม่เหล็กโลก",

 items:[
 ["ความลึก","ประมาณ 2,900–5,150 กิโลเมตร"],
 ["สถานะ","ของเหลว"],
 ["องค์ประกอบ","เหล็กและนิกเกิลเป็นหลัก"],
 ["บทบาท","เกี่ยวข้องกับสนามแม่เหล็กโลก"]
 ],

 fact:
 "การไหลเวียนของโลหะเหลวในแก่นโลกชั้นนอกมีส่วนสำคัญต่อการเกิดสนามแม่เหล็กโลก"
},

inner:{
 title:"แก่นโลกชั้นใน (Inner Core)",

 desc:
 "เป็นบริเวณใจกลางโลก มีความดันมหาศาล แม้อุณหภูมิสูงมาก แต่ความดันที่สูงทำให้โลหะบริเวณนี้อยู่ในสภาพของแข็งเป็นหลัก",

 items:[
 ["ความลึก","ประมาณ 5,150–6,371 กิโลเมตร"],
 ["สถานะ","ของแข็ง"],
 ["องค์ประกอบ","เหล็กและนิกเกิลเป็นหลัก"],
 ["อุณหภูมิ","หลายพันองศาเซลเซียส"]
 ],

 fact:
 "แก่นโลกชั้นในอยู่บริเวณใจกลางโลกและมีความดันสูงมาก"
}

};


/* =========================
   แสดงข้อมูล
========================= */

function showInfo(type,button){

 document.querySelectorAll(".tabs button")
   .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 const d=data[type];

 document.getElementById("content").innerHTML=`

 <div class="title">
   ${d.title}
 </div>

 <div class="description">
   ${d.desc}
 </div>

 <div class="data">

 ${d.items.map(x=>`

   <div class="dataBox">

     <b>${x[0]}</b>

     <span>${x[1]}</span>

   </div>

 `).join("")}

 </div>

 <div class="fact">

   <b>💡 รู้หรือไม่?</b>

   <br>

   ${d.fact}

 </div>

 `;

}

showInfo(
 "crust",
 document.querySelector(".tabs button")
);


/* =========================
   ระบบโลก 3D
========================= */

let canvas=
document.createElement("canvas");

canvas.width=800;
canvas.height=800;

canvas.style.width="100%";
canvas.style.height="100%";

document.getElementById("earthArea")
.appendChild(canvas);

const ctx=canvas.getContext("2d");

let rotation=0;
let scale=1;
let dragging=false;
let oldX=0;


/* วาดโลก */

function drawEarth(){

 ctx.clearRect(
   0,0,
   canvas.width,
   canvas.height
 );

 const cx=400;
 const cy=370;
 const R=220*scale;


 /* เงา */
 ctx.beginPath();

 ctx.arc(
   cx,
   cy,
   R,
   0,
   Math.PI*2
 );

 const ocean=
 ctx.createRadialGradient(
   cx-70,
   cy-80,
   20,
   cx,
   cy,
   R
 );

 ocean.addColorStop(0,"#4ecbff");
 ocean.addColorStop(.4,"#0877d1");
 ocean.addColorStop(1,"#021c5c");

 ctx.fillStyle=ocean;
 ctx.fill();


 /* ทวีปแบบ stylized */
 ctx.fillStyle="#3fb75d";

 const continents=[
   [-100,-80,55,85],
   [30,-90,70,45],
   [-30,10,55,80],
   [90,30,50,70],
   [15,100,70,35]
 ];

 continents.forEach(c=>{

   ctx.beginPath();

   ctx.ellipse(
     cx+c[0],
     cy+c[1],
     c[2],
     c[3],
     rotation,
     0,
     Math.PI*2
   );

   ctx.fill();

 });


 /* แสงโลก */

 const glow=
 ctx.createRadialGradient(
   cx-80,
   cy-90,
   20,
   cx,
   cy,
   R
 );

 glow.addColorStop(
   0,
   "rgba(255,255,255,.18)"
 );

 glow.addColorStop(
   1,
   "rgba(0,100,255,0)"
 );

 ctx.fillStyle=glow;

 ctx.beginPath();

 ctx.arc(
   cx,
   cy,
   R,
   0,
   Math.PI*2
 );

 ctx.fill();


 /* ตัดครึ่งโลก */

 ctx.save();

 ctx.beginPath();

 ctx.rect(
   cx,
   cy-R-5,
   R+10,
   R*2+10
 );

 ctx.clip();


 /* mantle */

 ctx.beginPath();

 ctx.arc(
   cx,
   cy,
   R*.74,
   0,
   Math.PI*2
 );

 const mantle=
 ctx.createRadialGradient(
   cx-40,
   cy-40,
   20,
   cx,
   cy,
   R*.74
 );

 mantle.addColorStop(0,"#ffbd35");
 mantle.addColorStop(.55,"#ef5b13");
 mantle.addColorStop(1,"#9d1708");

 ctx.fillStyle=mantle;

 ctx.fill();


 /* outer core */

 ctx.beginPath();

 ctx.arc(
   cx,
   cy,
   R*.48,
   0,
   Math.PI*2
 );

 ctx.fillStyle=
 "#c92713";

 ctx.fill();


 /* inner core */

 ctx.beginPath();

 ctx.arc(
   cx,
   cy,
   R*.27,
   0,
   Math.PI*2
 );

 const core=
 ctx.createRadialGradient(
   cx-25,
   cy-25,
   5,
   cx,
   cy,
   R*.27
 );

 core.addColorStop(0,"#fff66b");
 core.addColorStop(.5,"#ffc400");
 core.addColorStop(1,"#ff7a00");

 ctx.fillStyle=core;

 ctx.fill();

 ctx.restore();


 /* เส้นแบ่งชั้น */

 ctx.lineWidth=5;

 ctx.strokeStyle="#ff9c28";

 ctx.beginPath();

 ctx.arc(
   cx,
   cy,
   R*.74,
   -Math.PI/2,
   Math.PI/2
 );

 ctx.stroke();

 ctx.strokeStyle="#ff3b21";

 ctx.beginPath();

 ctx.arc(
   cx,
   cy,
   R*.48,
   -Math.PI/2,
   Math.PI/2
 );

 ctx.stroke();


 /* ป้าย */

 label(
   "เปลือกโลก",
   cx+R*.78,
   cy-R*.60,
   "#35a9ff"
 );

 label(
   "เนื้อโลก",
   cx+R*.75,
   cy-R*.15,
   "#ff9c38"
 );

 label(
   "แก่นโลกชั้นนอก",
   cx+R*.60,
   cy+R*.30,
   "#ff4b39"
 );

 label(
   "แก่นโลกชั้นใน",
   cx+R*.35,
   cy+R*.65,
   "#ffe331"
 );

}


function label(text,x,y,color){

 ctx.font=
 "bold 20px Arial";

 ctx.fillStyle=color;

 ctx.fillText(
   text,
   x,
   y
 );

}


/* =========================
   หมุน
========================= */

canvas.addEventListener(
 "pointerdown",
 e=>{
   dragging=true;
   oldX=e.clientX;
 }
);

canvas.addEventListener(
 "pointermove",
 e=>{

   if(!dragging)return;

   rotation+=
   (e.clientX-oldX)*.01;

   oldX=e.clientX;

   drawEarth();

 }
);

canvas.addEventListener(
 "pointerup",
 ()=>{
   dragging=false;
 }
);


/* ซูม */

function zoomIn(){

 scale=Math.min(
   1.5,
   scale+.1
 );

 drawEarth();

}

function zoomOut(){

 scale=Math.max(
   .65,
   scale-.1
 );

 drawEarth();

}

function resetEarth(){

 rotation=0;
 scale=1;

 drawEarth();

}


/* =========================
   เลือกชั้น
========================= */

function selectLayer(type,button){

 document.querySelectorAll(".layer")
   .forEach(x=>x.classList.remove("active"));

 button.classList.add("active");

 if(type!="all"){

   const tab=
   [...document.querySelectorAll(".tabs button")]
   .find(x=>
     x.textContent.includes(
       type=="crust"?"เปลือก":
       type=="mantle"?"เนื้อ":
       type=="outer"?"แก่นนอก":
       "แก่นใน"
     )
   );

   if(tab)tab.click();

 }

 drawEarth();

}


drawEarth();

</script>

</body>
</html>
