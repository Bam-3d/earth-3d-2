<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>โครงสร้างโลก 3 มิติ | Journey to the Core</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    font-family:"Prompt",sans-serif;
    color:white;

    background:
    radial-gradient(
        circle at 20% 20%,
        rgba(40,120,220,.18),
        transparent 32%
    ),
    radial-gradient(
        circle at 80% 80%,
        rgba(130,40,200,.12),
        transparent 30%
    ),
    #020611;

    overflow-x:hidden;
}

/* ดาว */

body:before{
    content:"";
    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:.35;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#fff .7px,transparent .7px);

    background-size:
        130px 130px,
        210px 210px;

    background-position:
        20px 30px,
        80px 100px;
}

/* HEADER */

header{
    position:relative;
    z-index:2;

    text-align:center;

    padding:24px 15px 18px;
}

header h1{
    font-size:clamp(28px,5vw,48px);

    font-weight:700;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #70c8ff
        );

    -webkit-background-clip:text;
    color:transparent;
}

header p{
    margin-top:5px;

    color:#91a9c0;

    font-size:14px;
}

/* MAIN */

.main{
    position:relative;
    z-index:2;

    width:94%;
    max-width:1500px;

    margin:auto;

    display:grid;

    grid-template-columns:
        minmax(0,1.5fr)
        minmax(350px,.75fr);

    gap:20px;
}

/* LEFT */

.left{
    min-width:0;
}

/* EARTH */

.earth-box{

    position:relative;

    height:650px;

    min-height:500px;

    overflow:hidden;

    border-radius:28px;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        radial-gradient(
            circle at center,
            rgba(25,80,140,.15),
            transparent 60%
        ),
        #020712;

    box-shadow:
        0 25px 80px rgba(0,0,0,.5),
        inset 0 0 80px rgba(50,150,255,.04);
}

/* โมเดล Sketchfab */

.earth-box iframe{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    border-radius:28px;
}

/* ป้าย */

.model-title{

    position:absolute;

    top:16px;
    left:16px;

    z-index:5;

    padding:9px 14px;

    border-radius:999px;

    background:
        rgba(3,10,20,.78);

    border:
        1px solid
        rgba(255,255,255,.14);

    backdrop-filter:blur(10px);

    font-size:12px;

    color:#ccecff;

    pointer-events:none;
}

/* คำแนะนำ */

.touch-help{

    position:absolute;

    right:16px;
    bottom:16px;

    z-index:5;

    padding:9px 13px;

    border-radius:12px;

    background:
        rgba(3,10,20,.75);

    border:
        1px solid
        rgba(255,255,255,.12);

    color:#a9bdd0;

    font-size:11px;

    pointer-events:none;
}

/* LAYERS */

.layers{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    margin-top:14px;
}

.layer{

    padding:13px 7px;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.11);

    background:
        rgba(10,19,34,.85);

    color:white;

    font-family:inherit;

    cursor:pointer;

    transition:.2s;
}

.layer:hover{

    transform:translateY(-2px);

    background:
        rgba(30,55,80,.9);
}

.layer.active{

    border-color:#62c4ff;

    box-shadow:
        0 0 22px
        rgba(70,180,255,.16);
}

.layer-icon{
    display:block;

    font-size:20px;

    margin-bottom:4px;
}

.layer-name{
    font-size:12px;
}

.layer-en{
    color:#8298ac;

    font-size:10px;
}

/* RIGHT */

.details{

    border-radius:26px;

    border:
        1px solid
        rgba(255,255,255,.12);

    padding:25px;

    background:
        linear-gradient(
            180deg,
            rgba(13,25,43,.94),
            rgba(5,12,22,.94)
        );

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.4);
}

.details h2{

    font-size:25px;
}

.details-sub{

    color:#8198ad;

    font-size:13px;

    margin-top:3px;
}

/* TABS */

.tabs{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:6px;

    margin-top:20px;
}

.tab{

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color:#91a5b8;

    border-radius:10px;

    padding:9px 4px;

    font-family:inherit;

    font-size:11px;

    cursor:pointer;
}

.tab.active{

    color:white;

    background:
        rgba(50,130,200,.25);

    border-color:
        rgba(80,180,255,.4);
}

/* CONTENT */

.content{

    margin-top:20px;
}

.content h3{

    font-size:25px;

    margin-bottom:4px;
}

.depth{

    color:#62c5ff;

    font-size:13px;

    margin-bottom:17px;
}

.content p{

    color:#c0cedb;

    font-size:14px;

    line-height:1.8;
}

.fact{

    margin-top:20px;

    padding:15px;

    border-radius:15px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.07);
}

.fact-title{

    font-weight:600;

    margin-bottom:8px;
}

.fact ul{

    padding-left:19px;

    color:#aebdca;

    font-size:13px;

    line-height:1.8;
}

/* CREDIT */

.credit{

    position:relative;
    z-index:2;

    text-align:center;

    padding:16px 10px 25px;

    color:#62768a;

    font-size:10px;
}

.credit a{

    color:#70c8ff;

    text-decoration:none;
}

/* TABLET */

@media(max-width:1000px){

    .main{

        grid-template-columns:1fr;
    }

    .earth-box{

        height:600px;
    }

}

/* MOBILE */

@media(max-width:600px){

    header{

        padding:
            18px
            10px
            12px;
    }

    header h1{

        font-size:27px;
    }

    header p{

        font-size:11px;
    }

    .main{

        width:94%;
    }

    .earth-box{

        height:480px;

        min-height:480px;

        border-radius:20px;
    }

    .earth-box iframe{

        border-radius:20px;
    }

    .model-title{

        top:10px;
        left:10px;

        font-size:10px;

        padding:
            7px 10px;
    }

    .touch-help{

        right:10px;
        bottom:10px;

        font-size:9px;

        padding:
            7px 9px;
    }

    .layers{

        grid-template-columns:
            repeat(2,1fr);
    }

    .details{

        padding:18px;

        border-radius:20px;
    }

    .details h2{

        font-size:21px;
    }

    .content h3{

        font-size:21px;
    }

    .content p{

        font-size:13px;
    }

}

</style>
</head>

<body>

<header>

    <h1>
        🌍 โครงสร้างโลก 3 มิติ
    </h1>

    <p>
        Journey to the Core — สำรวจโลกตั้งแต่เปลือกโลกจนถึงแก่นโลก
    </p>

</header>


<div class="main">


<!-- ==============================
     โลก 3D
================================ -->

<section class="left">

    <div class="earth-box">

        <div class="model-title">
            🌍 Earth Core V2 • Interactive 3D
        </div>

        <iframe
            title="Earth Core V2"
            src="https://sketchfab.com/models/6ba6e494d58c4465a45d7df85bffe97b/embed?autostart=1&ui_theme=dark&dnt=1"
            allow="autoplay; fullscreen; xr-spatial-tracking"
            allowfullscreen>
        </iframe>

        <div class="touch-help">
            👆 ลากเพื่อหมุน • 🤏 กาง/หุบเพื่อซูม
        </div>

    </div>


    <!-- ชั้นโลก -->

    <div class="layers">

        <button
            class="layer active"
            onclick="showLayer(0)">

            <span class="layer-icon">🪨</span>

            <span class="layer-name">
                เปลือกโลก
            </span>

            <span class="layer-en">
                Crust
            </span>

        </button>


        <button
            class="layer"
            onclick="showLayer(1)">

            <span class="layer-icon">🔥</span>

            <span class="layer-name">
                เนื้อโลก
            </span>

            <span class="layer-en">
                Mantle
            </span>

        </button>


        <button
            class="layer"
            onclick="showLayer(2)">

            <span class="layer-icon">🌋</span>

            <span class="layer-name">
                แก่นโลกชั้นนอก
            </span>

            <span class="layer-en">
                Outer Core
            </span>

        </button>


        <button
            class="layer"
            onclick="showLayer(3)">

            <span class="layer-icon">🔴</span>

            <span class="layer-name">
                แก่นโลกชั้นใน
            </span>

            <span class="layer-en">
                Inner Core
            </span>

        </button>

    </div>

</section>


<!-- ==============================
     รายละเอียด
================================ -->

<aside class="details">

    <h2>
        รายละเอียดแต่ละชั้น
    </h2>

    <div class="details-sub">
        กดเลือกชั้นเพื่อศึกษาข้อมูล
    </div>


    <div class="tabs">

        <button
            class="tab active"
            onclick="showLayer(0)">
            เปลือกโลก
        </button>

        <button
            class="tab"
            onclick="showLayer(1)">
            เนื้อโลก
        </button>

        <button
            class="tab"
            onclick="showLayer(2)">
            แก่นนอก
        </button>

        <button
            class="tab"
            onclick="showLayer(3)">
            แก่นใน
        </button>

    </div>


    <div
        id="content"
        class="content">
    </div>

</aside>

</div>


<div class="credit">

    โมเดล 3D:
    <a
        href="https://sketchfab.com/3d-models/earth-core-v2-6ba6e494d58c4465a45d7df85bffe97b"
        target="_blank">
        Earth Core V2 by Ipay
    </a>
    • CC BY

</div>


<script>

/* ===================================
   ข้อมูล 4 ชั้นของโลก
=================================== */

const data = [

{
    name:"เปลือกโลก",

    en:"Crust",

    depth:
    "ความหนาประมาณ 5–70 กิโลเมตร",

    text:
    "เปลือกโลกเป็นชั้นนอกสุดของโลก เป็นบริเวณที่มนุษย์อาศัยอยู่ และเป็นชั้นที่บางที่สุดของโครงสร้างโลก แบ่งออกเป็นเปลือกโลกทวีปและเปลือกโลกมหาสมุทร โดยเปลือกโลกทวีปโดยทั่วไปมีความหนามากกว่าเปลือกโลกมหาสมุทร",

    facts:[
        "เป็นชั้นนอกสุดของโลก",
        "ประกอบด้วยหินและแร่หลายชนิด",
        "มีทั้งส่วนที่เป็นทวีปและมหาสมุทร",
        "เป็นส่วนหนึ่งของแผ่นธรณีภาค"
    ]
},

{
    name:"เนื้อโลก",

    en:"Mantle",

    depth:
    "ลึกประมาณ 70–2,900 กิโลเมตร",

    text:
    "เนื้อโลกเป็นชั้นที่อยู่ใต้เปลือกโลกและมีความหนามากที่สุด ประกอบด้วยหินซิลิเกตที่มีแมกนีเซียมและเหล็กเป็นองค์ประกอบสำคัญ ภายในชั้นนี้มีการถ่ายเทความร้อนและการเคลื่อนที่ของสสารอย่างช้า ๆ",

    facts:[
        "เป็นชั้นที่มีความหนามากที่สุด",
        "มีอุณหภูมิสูงขึ้นตามความลึก",
        "เกิดการพาความร้อนภายใน",
        "เกี่ยวข้องกับการเคลื่อนที่ของแผ่นธรณีภาค"
    ]
},

{
    name:"แก่นโลกชั้นนอก",

    en:"Outer Core",

    depth:
    "ลึกประมาณ 2,900–5,150 กิโลเมตร",

    text:
    "แก่นโลกชั้นนอกอยู่ใต้เนื้อโลก มีเหล็กและนิกเกิลเป็นองค์ประกอบสำคัญ และอยู่ในสถานะของเหลว การเคลื่อนที่ของโลหะเหลวภายในบริเวณนี้มีความเกี่ยวข้องกับการเกิดสนามแม่เหล็กโลก",

    facts:[
        "อยู่ในสถานะของเหลว",
        "มีเหล็กและนิกเกิลเป็นองค์ประกอบหลัก",
        "มีอุณหภูมิและความดันสูงมาก",
        "เกี่ยวข้องกับสนามแม่เหล็กโลก"
    ]
},

{
    name:"แก่นโลกชั้นใน",

    en:"Inner Core",

    depth:
    "ลึกประมาณ 5,150–6,371 กิโลเมตร",

    text:
    "แก่นโลกชั้นในเป็นบริเวณใจกลางโลก มีเหล็กและนิกเกิลเป็นองค์ประกอบสำคัญ แม้จะมีอุณหภูมิสูงมาก แต่ความดันมหาศาลทำให้บริเวณนี้มีสถานะเป็นของแข็ง",

    facts:[
        "อยู่ใจกลางโลก",
        "มีเหล็กและนิกเกิลเป็นองค์ประกอบหลัก",
        "มีอุณหภูมิสูงมาก",
        "ความดันสูงทำให้เป็นของแข็ง"
    ]
}

];


/* ===================================
   แสดงข้อมูล
=================================== */

function showLayer(index){

    /* ปุ่มด้านล่าง */

    document
    .querySelectorAll(".layer")
    .forEach(
        (button,i)=>{
            button.classList.toggle(
                "active",
                i===index
            );
        }
    );


    /* ปุ่มด้านขวา */

    document
    .querySelectorAll(".tab")
    .forEach(
        (button,i)=>{
            button.classList.toggle(
                "active",
                i===index
            );
        }
    );


    const item=data[index];


    document.getElementById("content")
    .innerHTML=`

        <h3>
            ${item.name}
        </h3>

        <div class="depth">

            ${item.en}
            •
            ${item.depth}

        </div>

        <p>

            ${item.text}

        </p>

        <div class="fact">

            <div class="fact-title">
                💡 สิ่งที่ควรรู้
            </div>

            <ul>

                ${item.facts
                    .map(
                        fact =>
                        `<li>${fact}</li>`
                    )
                    .join("")
                }

            </ul>

        </div>
    `;
}


/* เริ่มต้น */

showLayer(0);

</script>

</body>
</html>
